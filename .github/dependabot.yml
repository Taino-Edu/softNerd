# Dependabot — PRs semanais com atualização de dependências (agrupadas pra não
# virar enxurrada). Correção de segurança vem na hora, fora desse calendário.
# Todo PR do Dependabot passa pelo CI inteiro antes de poder entrar.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ['/CardGameStore', '/tests/unit/CardGameStore.Tests']
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      nuget-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/CardGameStore', '/frontend']
    schedule: { interval: monthly }
