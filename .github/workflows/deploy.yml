# =============================================================================
# Deploy produção — começa SOZINHO depois do merge e ESPERA a aprovação do Taino
#
# Fluxo: merge no main → CI verde → este workflow abre e fica "Waiting" no ambiente
# "producao" → o GitHub avisa (e-mail/app) → Aprovar → sobe. Aprovar é escolher a
# hora: não aprovou, não sobe. Também dá pra rodar à mão (Actions → Run workflow).
#
# Roda deploy/update.sh na VPS (backup dos bancos → git pull → build com o site no
# ar → troca sem queda, deploy/rollout.sh). Enquanto isso o vigia mede se algum
# pedido falhou; depois confere o /health e passa o smoke (scripts/smoke.py).
#
# Proteções:
#   - só roda a partir do main, e só se o último CI do main passou
#   - ambiente "producao": só aceita o main e exige aprovação do Taino
#   - a chave SSH do deploy é presa na VPS ao porteiro /usr/local/bin/santuario-ci,
#     que só aceita "ping", "status" e "deploy" (registra tudo em
#     /var/log/santuario-ci.log): mesmo vazada, não abre terminal nem roda outra coisa
#
# Segredos (no ambiente "producao"):
#   DEPLOY_HOST         IP da VPS
#   DEPLOY_SSH_KEY      chave privada do deploy (só pra isso, não é a de ninguém)
#   DEPLOY_KNOWN_HOSTS  digital da VPS (evita aceitar servidor falso)
# =============================================================================
name: Deploy produção

on:
  # Automático: quando o CI de um push no main termina (o job só segue se passou)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # À mão, pelo botão Run workflow
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Subir pra produção
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 30
    # Automático só quando o CI foi de um push no main e passou; à mão, só do main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: O CI do main passou? (e é a última versão)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O update.sh sobe a ÚLTIMA versão do main. Só segue se o CI dela passou —
          # se entrou outro merge depois, o deploy dele vem logo em seguida.
          ultimo=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          conclusao=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --commit "$ultimo" --limit 1 --json conclusion -q '.[0].conclusion')
          echo "Último commit do main: $ultimo — CI: ${conclusao:-ainda não terminou}"
          if [ "$conclusao" != "success" ]; then
            echo "::error::O CI do último commit do main ($ultimo) não passou (ou está rodando). Deploy cancelado."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Começar a vigiar o site (mede o deploy pedido a pedido)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Fica em segundo plano até o passo "Resultado do vigia". 0,5/s por rota:
          # bem abaixo do limite de 200/min por IP da API (o smoke usa o mesmo IP).
          nohup python scripts/vigia-deploy.py --segundos 1200 --por-segundo 0.5             --parar-quando-existir /tmp/vigia-parar > /tmp/vigia.txt 2>&1 &

      - name: Preparar a chave do deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: A VPS atende? (ping + versão no ar antes)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes root@$DEPLOY_HOST"
          $SSH ping
          $SSH status | tee antes.txt
          {
            echo "### Antes do deploy"
            echo '```'
            cat antes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rodar o update.sh na VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # O porteiro só roda o update.sh pra esse pedido (command= no authorized_keys)
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$DEPLOY_HOST" deploy

      - name: A API voltou?
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' https://santuarionerd.com.br/health || true)
            if [ "$codigo" = "200" ]; then echo "/health respondeu 200"; exit 0; fi
            echo "tentativa $i: /health = $codigo"; sleep 10
          done
          echo "::error::A API não respondeu 200 no /health em 5 minutos. Veja: cd /opt/santuarionerd/deploy && docker compose -f docker-compose.prod.yml logs api --since 10m"
          exit 1

      - name: Resultado do vigia (o site caiu durante o deploy?)
        if: always()
        run: |
          touch /tmp/vigia-parar
          for i in $(seq 1 30); do grep -qE "nenhuma falha|pedidos falharam" /tmp/vigia.txt 2>/dev/null && break; sleep 1; done
          cat /tmp/vigia.txt
          { echo "### Vigia durante o deploy"; echo; sed -n '/^| Rota/,$p' /tmp/vigia.txt; } >> "$GITHUB_STEP_SUMMARY"
          # Avisa sem derrubar o job: o deploy em si pode ter dado certo
          grep -q "pedidos falharam" /tmp/vigia.txt && echo "::warning::Algum pedido falhou durante o deploy — veja a tabela do vigia no resumo" || true

      - name: Smoke em produção
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/smoke.py

      - name: Como voltar (se algo falhou)
        if: failure()
        run: |
          {
            echo "### ⚠️ Deploy com problema"
            echo "O banco só ganha colunas e tabelas novas, então voltar a versão é seguro. Na VPS:"
            echo '```'
            echo 'cd /opt/santuarionerd && bash deploy/update.sh <commit-anterior>'
            echo '```'
            echo 'O commit anterior está em "Antes do deploy", acima. Depois de resolver, um update.sh sem argumento volta pro main.'
            echo 'Se o problema for a troca sem queda em si: DEPLOY_AZUL_VERDE=0 bash deploy/update.sh (jeito antigo, ~15 s fora).'
          } >> "$GITHUB_STEP_SUMMARY"
