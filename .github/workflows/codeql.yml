# =============================================================================
# CodeQL — varredura de segurança do código (C# e TypeScript)
# Acha injeção, XSS, segredo no código, desserialização perigosa etc. Os achados
# aparecem em Security → Code scanning. Grátis em repositório público.
# =============================================================================
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # toda segunda, 03h17 em Brasília

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analisar:
    name: CodeQL (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        linguagem: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.linguagem }}
