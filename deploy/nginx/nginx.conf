# =============================================================================
# nginx.conf — Proxy reverso para SantuárioNerd
# Cloudflare (HTTPS) → Nginx (HTTP 80) → containers Docker
#
# Domínio canônico: santuarionerd.com.br
# santuarionerd.tech continua respondendo, mas só como 301 para o .com.br
# =============================================================================

# DNS interno do Docker — resolve upstreams em runtime (evita falha na startup).
# valid=5s: na troca sem queda (deploy/rollout.sh) a cópia nova da api/frontend entra
# no DNS ao lado da antiga; o nginx precisa enxergar isso rápido. O rollout espera
# mais que isso antes de desligar a antiga.
resolver 127.0.0.11 valid=5s ipv6=off;

# Na troca, quando a cópia antiga desliga, a conexão com ela é recusada: tenta a
# outra cópia (POST também — a recusa acontece antes de mandar o pedido, então não
# há risco de gravar duas vezes; "non_idempotent" NÃO está ligado de propósito).
proxy_next_upstream       error timeout;
proxy_next_upstream_tries 2;
# Cópia que acabou de sair ainda pode estar no cache de DNS por até 5 s: sem conexão em
# 3 s, vai pra outra (o padrão era 60 s). Não baixar pra 1 s: no teste, a rede do Docker
# trava ~1 s quando um container sai e isso derrubava pedido pra quem nem estava trocando.
proxy_connect_timeout     3s;

# IPs reais dos visitantes via Cloudflare
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# -----------------------------------------------------------------------------
# REDIRECT — domínio antigo (.tech) e www → domínio canônico (apex .com.br)
# 301 permanente preserva o SEO acumulado no .tech.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name santuarionerd.tech www.santuarionerd.tech www.santuarionerd.com.br;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://santuarionerd.com.br$request_uri;
}

server {
    listen 80;
    server_name santuarionerd.com.br;

    include /etc/nginx/snippets/locations.conf;
}

# -----------------------------------------------------------------------------
# HTTPS — Cloudflare Origin Certificate (modo Full / Full strict)
# Só entra em uso quando SSL/TLS = Full ou Full strict no painel Cloudflare;
# em Flexible a Cloudflare continua falando com o bloco :80 acima.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name santuarionerd.com.br;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/locations.conf;
}
