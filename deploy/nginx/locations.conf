# =============================================================================
# locations.conf — rotas compartilhadas entre os servers HTTP (80) e HTTPS (443)
# =============================================================================

# Upload de imagens de produtos (até 10 MB)
client_max_body_size 10M;

# -----------------------------------------------------------------------------
# Frontend — Next.js 14
# -----------------------------------------------------------------------------
location / {
    set $fe http://frontend:3000;
    proxy_pass         $fe;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

# -----------------------------------------------------------------------------
# API — ASP.NET Core 8
# -----------------------------------------------------------------------------
location /api/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

# -----------------------------------------------------------------------------
# SignalR — WebSocket (dashboard em tempo real)
# -----------------------------------------------------------------------------
location /hubs/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# -----------------------------------------------------------------------------
# Health check
# -----------------------------------------------------------------------------
location /health {
    set $api http://api:5000;
    proxy_pass       $api;
    proxy_set_header Host $host;
    access_log       off;
}

# -----------------------------------------------------------------------------
# Uploads estáticos (imagens de produtos)
# -----------------------------------------------------------------------------
location /uploads/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_set_header   Host $host;
    expires            7d;
    add_header         Cache-Control "public, no-transform";
}
