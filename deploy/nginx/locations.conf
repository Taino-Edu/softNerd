# =============================================================================
# locations.conf — rotas compartilhadas entre os servers HTTP (80) e HTTPS (443)
# =============================================================================

# Upload de imagens de produtos (até 10 MB)
client_max_body_size 10M;

# -----------------------------------------------------------------------------
# Otimizador de imagens do Next — FECHADO
# Já teve falha crítica de execução remota de código (Next 14; corrigida no 15.5.24).
# O front não usa (images.unoptimized no next.config.js): fechado de propósito,
# como camada extra. Só reabrir junto com o images.unoptimized, se um dia precisar.
# -----------------------------------------------------------------------------
location ^~ /_next/image {
    return 404;
}

# -----------------------------------------------------------------------------
# Frontend — Next.js 15
# -----------------------------------------------------------------------------
location / {
    set $fe http://frontend:3000;
    proxy_pass         $fe;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

# -----------------------------------------------------------------------------
# API — ASP.NET Core 8
# -----------------------------------------------------------------------------
location /api/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

# -----------------------------------------------------------------------------
# SignalR — WebSocket (dashboard em tempo real)
# -----------------------------------------------------------------------------
location /hubs/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# -----------------------------------------------------------------------------
# Health check
# -----------------------------------------------------------------------------
location /health {
    set $api http://api:5000;
    proxy_pass       $api;
    proxy_set_header Host $host;
    access_log       off;
}

# -----------------------------------------------------------------------------
# Uploads estáticos (imagens de produtos)
# -----------------------------------------------------------------------------
location /uploads/ {
    set $api http://api:5000;
    proxy_pass         $api;
    proxy_set_header   Host $host;
    # Original: 7 dias. Miniatura (?w=): o cache curto da API (map em nginx.conf)
    expires            $uploads_expira;
    add_header         Cache-Control $uploads_cache;
}
