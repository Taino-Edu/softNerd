# =============================================================================
# docker-compose.prod.yml — Produção SantuárioNerd (Hostinger KVM 1)
#
# COMO USAR (primeira vez):
#   cd /opt/santuarionerd
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Atualizar código:
#   git pull && docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d
#
# Acesso público: https://santuarionerd.com.br  (Cloudflare → porta 80)
# santuarionerd.tech continua registrado, redirecionando 301 para o .com.br
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # NGINX — Único serviço exposto ao mundo (porta 80)
  # Recebe HTTPS do Cloudflare e roteia para frontend e API
  # ---------------------------------------------------------------------------
  nginx:
    # Versão exata (não "1.30" solto): é a porta de entrada da internet. Trocar aqui faz o
    # update.sh baixar, validar a config e recriar o nginx (~1 s de pedido recusado).
    # 1.30.6: correções de 14/10/2026 (map/alias/rewrite, TLS) — a 1.27 não recebe mais.
    image: nginx:1.30.6-alpine
    container_name: santuarionerd_nginx
    # Só é recriado na troca de montagem (uma vez); 3 s pra soltar as portas em vez de 10
    stop_grace_period: 3s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A PASTA inteira em snippets/ (não arquivo por arquivo): montagem de arquivo prende o
      # container ao arquivo antigo depois do git pull e obrigava a recriar o nginx (~10 s de
      # pedidos parados). Com a pasta, o update.sh só valida e faz "nginx -s reload".
      # O default.conf é só uma entrada fixa de 1 linha que inclui snippets/nginx.conf —
      # nunca muda, então não tem problema ele ficar preso.
      - ./nginx/entrada.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - api_uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - api
    networks:
      - cardgame_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FRONTEND — Next.js 14
  # NEXT_PUBLIC_API_URL é baked no build (URL que o browser usa para a API)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_URL: https://santuarionerd.com.br
    image: santuarionerd_frontend:latest
    # Sem container_name: na troca sem queda (deploy/rollout.sh) existem duas cópias
    # por alguns segundos, e nome fixo não deixa. Logs: docker compose logs frontend
    stop_grace_period: 15s
    networks:
      - cardgame_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # API — ASP.NET Core 8
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../CardGameStore
      dockerfile: Dockerfile
    image: santuarionerd_api:latest
    # Sem container_name: na troca sem queda (deploy/rollout.sh) existem duas cópias
    # por alguns segundos, e nome fixo não deixa. Logs: docker compose logs api
    # 35 s pra terminar o que está fazendo ao desligar (o .NET espera até 30 s pelas
    # requisições em andamento; o padrão do Docker, 10 s, cortava venda no meio).
    stop_grace_period: 35s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # Log do ASP.NET: Warning = só o que importa (CardGameStore/Middleware/PedidosNoLogMiddleware.cs).
      # Pra investigar, LOG_ASPNETCORE=Information no .env e `bash rollout.sh api` (troca sem queda).
      Logging__LogLevel__Microsoft.AspNetCore: "${LOG_ASPNETCORE:-Warning}"
      # Banco de dados
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cardgamestore};Username=${POSTGRES_USER:-cardgame_user};Password=${POSTGRES_PASSWORD}"
      MongoDbSettings__ConnectionString: "mongodb://${MONGO_USER:-mongo_admin}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MongoDbSettings__DatabaseName: "cardgamestore_cache"
      # JWT
      JwtSettings__SecretKey: "${JWT_SECRET}"
      # NÃO trocar para o .com.br: ValidateIssuer=true (Program.cs), mudar esta
      # string invalida todos os tokens já emitidos e desloga todo mundo.
      # É só um identificador, não precisa bater com o domínio real.
      JwtSettings__Issuer: "https://santuarionerd.tech"
      JwtSettings__Audience: "CardGameStore-Frontend"
      JwtSettings__AccessTokenExpirationMinutes: "60"
      JwtSettings__RefreshTokenExpirationDays: "30"
      # Entrar com Google: Client ID público do Google Cloud Console (vazio = botão escondido).
      # Pôr GOOGLE_CLIENT_ID=...apps.googleusercontent.com no .env da VPS e rodar o update.
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-}"
      # E-mail (Resend)
      SmtpSettings__Host: "${SMTP_HOST:-smtp.resend.com}"
      SmtpSettings__Port: "${SMTP_PORT:-587}"
      SmtpSettings__Username: "${SMTP_USERNAME:-resend}"
      SmtpSettings__Password: "${SMTP_PASSWORD}"
      # Remetente segue no .tech de propósito: trocar para @santuarionerd.com.br
      # só DEPOIS de verificar o domínio novo no Resend (SPF/DKIM), senão todo
      # e-mail transacional para de sair.
      SmtpSettings__FromEmail: "${SMTP_FROM_EMAIL:-noreply@santuarionerd.tech}"
      SmtpSettings__FromName: "${SMTP_FROM_NAME:-Santuário Nerd}"
      SmtpSettings__AppUrl: "${APP_URL:-https://santuarionerd.com.br}"
      # Integrações
      GeminiSettings__ApiKey: "${GEMINI_API_KEY}"
      Vapid__PublicKey: "${VAPID_PUBLIC_KEY:-}"
      Vapid__PrivateKey: "${VAPID_PRIVATE_KEY:-}"
      Vapid__Subject: "${VAPID_SUBJECT:-mailto:contato@santuarionerd.com.br}"
      TcgSettings__PokemonApiKey: "${POKEMON_API_KEY:-}"
      TcgSettings__RiotApiKey: "${RIOT_API_KEY:-}"
      # Inter PJ — certificado mTLS (Client ID/Secret são salvos via /admin/integracoes)
      Inter__CertificatePath: "/app/certs/inter/inter.crt"
      Inter__KeyPath: "/app/certs/inter/inter.key"
      # Segurança — HTTPS via Cloudflare, cookies Secure=true
      COOKIE_SECURE: "true"
      CorsSettings__AllowedOrigins: "https://santuarionerd.com.br,https://www.santuarionerd.com.br,https://santuarionerd.tech,https://www.santuarionerd.tech"
      Security__IpHashSalt: "${IP_HASH_SALT}"
      Encryption__Key: "${ENCRYPTION_KEY}"
    volumes:
      - api_uploads:/app/wwwroot/uploads
      - ./certs/inter:/app/certs/inter
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - cardgame_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # POSTGRESQL — Banco relacional (comandas, usuários, etc.)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: santuarionerd_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cardgamestore}
      POSTGRES_USER:     ${POSTGRES_USER:-cardgame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cardgame_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardgame_user} -d ${POSTGRES_DB:-cardgamestore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MONGODB — Cache de cartas TCG (Pokémon, MTG, etc.)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7-jammy
    container_name: santuarionerd_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-mongo_admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongo_data:/data/db
    networks:
      - cardgame_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# -----------------------------------------------------------------------------
# Volumes persistentes (dados sobrevivem a reinicios e redeploys)
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  mongo_data:
  api_uploads:

# -----------------------------------------------------------------------------
# Rede interna Docker (containers se falam pelo nome do serviço)
# -----------------------------------------------------------------------------
networks:
  cardgame_network:
    driver: bridge
